[package]
name = "viim"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "rayon"] }
resvg = "0.50.0"
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
